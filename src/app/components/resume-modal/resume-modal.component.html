<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-3 backdrop-blur-md sm:p-6" (click)="closed.emit()">
  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="resume-modal-title"
    class="flex max-h-[94vh] w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-white/10 bg-[#161618] shadow-2xl"
    (click)="$event.stopPropagation()">
    <header class="flex items-center justify-between gap-4 border-b border-white/10 px-5 py-4 sm:px-6">
      <div>
        <h2 id="resume-modal-title" class="text-lg font-semibold text-white">{{ i18n.translate('CV de Erik Avagyan') }}</h2>
        <p class="mt-1 text-xs text-[#86868b]">PDF</p>
      </div>
      <div class="flex items-center gap-2">
        <a
          href="/cv.pdf"
          download="Erik-Avagyan-CV.pdf"
          class="rounded-full bg-white px-4 py-2 text-xs font-medium text-black hover:bg-neutral-200">
          {{ i18n.translate('Descargar CV') }}
        </a>
        <button
          (click)="closed.emit()"
          class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-medium text-white hover:bg-white/10">
          {{ i18n.translate('Cerrar') }}
        </button>
      </div>
    </header>

    <iframe
      src="/cv.pdf"
      [title]="i18n.translate('Vista previa del CV de Erik Avagyan')"
      class="min-h-[65vh] w-full flex-1 border-0 bg-white">
    </iframe>
  </section>
</div>
