<section id="contacto" class="mx-auto max-w-5xl border-t border-white/10 px-6 py-20 text-center">
  <div class="mx-auto max-w-xl">
    <span class="text-xs font-semibold uppercase tracking-widest text-[#2997ff]">{{ i18n.translate('contact.eyebrow') }}</span>
    <h2 class="mb-4 mt-2 text-3xl font-bold text-white sm:text-4xl">{{ i18n.translate('contact.title') }}</h2>
    <p class="mb-8 text-sm leading-relaxed text-[#86868b]">
      {{ i18n.translate('contact.description') }}
    </p>

    <div class="inline-flex max-w-full items-center gap-3 rounded-full border border-white/10 bg-[#161618] p-2 pl-4">
      <span class="truncate font-mono text-xs text-white sm:text-sm">{{ contact.email }}</span>
      <button
        (click)="copyEmail()"
        class="shrink-0 rounded-full bg-white px-4 py-2 text-xs font-medium text-black transition-all hover:bg-neutral-200">
        @switch (copyStatus()) {
          @case ('copied') { {{ i18n.translate('contact.copied') }} }
          @case ('error') { {{ i18n.translate('contact.copyError') }} }
          @default { {{ i18n.translate('contact.copyEmail') }} }
        }
      </button>
    </div>
    <p class="mt-4 text-sm text-[#86868b]">
      {{ i18n.translate('contact.phone') }}:
      <a [href]="'tel:' + contact.phone.replaceAll(' ', '')" class="text-[#2997ff] hover:underline">{{ contact.phone }}</a>
    </p>
  </div>

  <footer class="mt-20 flex flex-col items-center justify-between gap-4 border-t border-white/5 pt-8 text-xs text-[#86868b] sm:flex-row">
    <p>© {{ currentYear }} Erik Avagyan. {{ i18n.translate('contact.footer') }}</p>
  </footer>
</section>
